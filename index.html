<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taula periòdica · Joc</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #1c2230;
    --muted: #6a7385;
    --line: #d9dde5;
    --accent: #3b5bdb;
    --accent-ink: #ffffff;
    --ok: #2b8a3e;
    --ok-bg: #e3f4e7;
    --mid: #b36b00;
    --mid-bg: #fff1d6;
    --ko: #c92a2a;
    --ko-bg: #fde4e4;
    --cell: #fbeccd;
    --neg: #1c7ed6;
    --pos: #e03131;
    --cell-off: #f3f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b2029;
      --ink: #e8ebf2;
      --muted: #98a1b3;
      --line: #2e3544;
      --accent: #748ffc;
      --accent-ink: #0f1320;
      --ok: #69db7c;
      --ok-bg: #1d3a26;
      --mid: #ffc078;
      --mid-bg: #3d2f14;
      --ko: #ff8787;
      --ko-bg: #402022;
      --cell: #3a3322;
      --neg: #74c0fc;
      --pos: #ff8787;
      --cell-off: #1a1e27;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  .board { order: 1; }
  .panel { order: 2; }
  @media (min-width: 1000px) {
    .app { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
    .panel { position: sticky; top: 16px; }
  }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button, input { font: inherit; color: inherit; }
  select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px;
  }

  /* ---------- Taula ---------- */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; container-type: inline-size; }
  .table {
    display: grid;
    grid-template-columns: 1.2em repeat(17, minmax(0, 1fr));
    grid-template-rows: 1.2em repeat(6, auto);
    gap: 2px;
    font-size: calc(100cqw / 18 * 0.26);
  }
  .hdr { color: var(--muted); display: grid; place-items: center; font-size: 1em; }
  .cell {
    aspect-ratio: 3 / 4; border-radius: 3px; background: var(--cell);
    display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
    padding: 2px 3px; line-height: 1.05; overflow: hidden; border: 1px solid transparent; min-width: 0;
  }
  .cell.off { opacity: .35; }
  .cell.blank { background: var(--surface); border: 1px solid var(--line); }
  .cell .s { font-weight: 700; font-size: 1.5em; }
  .cell .cs { display: flex; justify-content: flex-end; gap: .4em; font-size: .8em; text-align: right; }
  .cell .cs .pp { display: flex; flex-direction: column; }
  .cell .cs i { font-style: normal; }
  .cell .cs .n { color: var(--neg); }
  .cell .cs .p { color: var(--pos); }
  .cell.ok  { background: var(--ok-bg);  border-color: var(--ok); }
  .cell.mid { background: var(--mid-bg); border-color: var(--mid); }
  .cell.ko  { background: var(--ko-bg);  border-color: var(--ko); }
  .cell.cur {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    animation: pulse 1.2s ease-in-out infinite; z-index: 1; align-items: center; justify-content: center;
  }
  .cell.cur::after { content: "?"; font-weight: 800; font-size: 1.9em; }
  @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .cell.cur { animation: none; } }
  @container (max-width: 640px) { .cell .cs { display: none; } .cell { align-items: center; justify-content: center; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
  .legend i { display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }

  /* ---------- Panell ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  .stats { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .9rem; }
  .stats b { color: var(--ink); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .where { font-weight: 600; font-size: 1.05rem; }
  .where small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  form { display: grid; gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field > label, .field > .lbl { font-size: .85rem; color: var(--muted); }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 1.1rem;
  }
  .field.ok input { border-color: var(--ok); background: var(--ok-bg); }
  .field.ko input { border-color: var(--ko); background: var(--ko-bg); }
  .field.ok .seg label.on { background: var(--ok); border-color: var(--ok); }
  .field.ko .seg label.on { background: var(--ko); border-color: var(--ko); }
  .field .note { font-size: .8rem; min-height: 0; }
  .field.ok .note { color: var(--ok); }
  .field.ko .note { color: var(--ko); }
  .chips { display: grid; gap: 6px; }
  .chiprow { display: flex; gap: 4px; }
  .chip {
    flex: 1 1 0; min-width: 0; padding: 0; min-height: 44px; font-weight: 700; font-size: 1.05rem;
    border: 2px solid var(--line); background: var(--bg);
  }
  .chip.n { color: var(--neg); }
  .chip.p { color: var(--pos); }
  .chip[aria-pressed=true].n { background: var(--neg); border-color: var(--neg); color: #fff; }
  .chip[aria-pressed=true].p { background: var(--pos); border-color: var(--pos); color: #fff; }
  .field.ok .chip { border-color: var(--ok); }
  .field.ko .chip { border-color: var(--ko); }
  .field.disabled { opacity: .55; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .primary { flex: 1 1 140px; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }
  .msg.show { display: block; }
  .msg.good { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--ko-bg); color: var(--ko); }
  .msg.info { background: var(--mid-bg); color: var(--mid); }
  .done { text-align: center; display: none; gap: 10px; }
  .done h2 { margin: 0; }
  .done.show { display: grid; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Taula periòdica · Joc</h1>
    <div class="controls">
      <label class="sr" for="scope">Abast</label>
      <select id="scope">
        <option value="all">Tota la taula (47)</option>
        <option value="p3">Períodes 1–3</option>
        <option value="p4">Períodes 1–4</option>
        <option value="main">Només grups principals</option>
        <option value="trans">Només metalls de transició</option>
      </select>
      <button id="restart" type="button">Reinicia</button>
    </div>
  </header>

  <section class="panel" aria-live="polite">
    <div class="stats">
      <span>Ronda: <b id="stDone">0</b>/<b id="stTotal">0</b></span>
      <span>Al primer intent: <b id="stFirst">0</b></span>
    </div>
    <div class="bar"><div id="bar"></div></div>

    <div id="quiz">
      <div class="where" id="where"></div>
      <form id="form" autocomplete="off" novalidate>
        <div class="field" id="fSym">
          <label for="inSym">Símbol</label>
          <input type="text" id="inSym" maxlength="3" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fCh">
          <span class="lbl" id="lblCh">+/− (marca tots els valors)</span>
          <div class="chips" role="group" aria-labelledby="lblCh">
            <div class="chiprow" id="chNeg"></div>
            <div class="chiprow" id="chPos"></div>
          </div>
          <div class="note"></div>
        </div>
        <div class="field" id="fName">
          <label for="inName">Nom (en català)</label>
          <input type="text" id="inName" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fZ">
          <label for="inZ">Protons</label>
          <input type="number" id="inZ" min="1" max="118" inputmode="numeric">
          <div class="note"></div>
        </div>
        <div class="msg" id="msg" role="status"></div>
        <div class="actions">
          <button class="primary" id="btnMain" type="submit">Comprova</button>
          <button id="btnSolve" type="button">Solució</button>
          <button id="btnSkip" type="button">Salta</button>
        </div>
      </form>
    </div>

    <div class="done" id="done">
      <h2>Taula completada! 🎉</h2>
      <p id="doneTxt"></p>
      <button class="primary" id="btnAgain" type="button">Torna a jugar</button>
    </div>
  </section>

  <section class="board">
    <div class="table" id="table" role="img" aria-label="Taula periòdica"></div>
    <div class="legend">
      <span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Al primer intent</span>
      <span><i style="background:var(--mid-bg);border-color:var(--mid)"></i>Amb errors</span>
      <span><i style="background:var(--ko-bg);border-color:var(--ko)"></i>Solució / saltat</span>
    </div>
  </section>
</div>

<script>
'use strict';

// [nº atòmic, símbol, nom en català (IEC), valors +/− de la taula]
const DATA = [
  [1,'H','hidrogen',[-1,1]],
  [3,'Li','liti',[1]],[4,'Be','beril·li',[2]],[5,'B','bor',[-3,3]],[6,'C','carboni',[-4,2,4]],[7,'N','nitrogen',[-3,1,2,3,5]],[8,'O','oxigen',[-2,-1]],[9,'F','fluor',[-1]],
  [11,'Na','sodi',[1]],[12,'Mg','magnesi',[2]],[13,'Al','alumini',[3]],[14,'Si','silici',[-4,2,4]],[15,'P','fòsfor',[-3,3,5]],[16,'S','sofre',[-2,2,4,6]],[17,'Cl','clor',[-1,1,3,5,7]],
  [19,'K','potassi',[1]],[20,'Ca','calci',[2]],[24,'Cr','crom',[2,3,6]],[25,'Mn','manganès',[2,3,4,6,7]],[26,'Fe','ferro',[2,3]],[27,'Co','cobalt',[2,3]],[28,'Ni','níquel',[2,3]],[29,'Cu','coure',[1,2]],[30,'Zn','zinc',[2]],
  [31,'Ga','gal·li',[3]],[32,'Ge','germani',[-4,2,4]],[33,'As','arsènic',[-3,3,5]],[34,'Se','seleni',[-2,2,4,6]],[35,'Br','brom',[-1,1,3,5,7]],
  [37,'Rb','rubidi',[1]],[38,'Sr','estronci',[2]],[46,'Pd','pal·ladi',[2,4]],[47,'Ag','plata',[1]],[48,'Cd','cadmi',[2]],[49,'In','indi',[3]],[50,'Sn','estany',[2,4]],[51,'Sb','antimoni',[-3,3,5]],[52,'Te','tel·luri',[-2,2,4,6]],[53,'I','iode',[-1,1,3,5,7]],
  [55,'Cs','cesi',[1]],[56,'Ba','bari',[2]],[78,'Pt','platí',[2,4]],[79,'Au','or',[1,3]],[80,'Hg','mercuri',[1,2]],[81,'Tl','tal·li',[1,3]],[82,'Pb','plom',[2,4]],[83,'Bi','bismut',[3,5]],
];
const ELS = DATA.map(e => ({ z: e[0], sym: e[1], name: e[2], ch: e[3] }));
const BY_Z = Object.fromEntries(ELS.map(e => [e.z, e]));

// Posició (fila = període, columna = grup)
function pos(z) {
  if (z === 1) return [1, 1];
  if (z <= 4) return [2, z - 2];
  if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10];
  if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18];
  if (z <= 54) return [5, z - 36];
  if (z <= 56) return [6, z - 54];
  return [6, z - 68]; // Hf..Bi (72–83)
}
// Caselles buides de la taula (no es pregunten)
const BLANKS = [[4,3],[4,4],[4,5],
  [5,3],[5,4],[5,5],[5,6],[5,7],[5,8],[5,9],
  [6,3],[6,4],[6,5],[6,6],[6,7],[6,8],[6,9],[6,16],[6,17]];

const SCOPES = {
  all:   z => true,
  p3:    z => pos(z)[0] <= 3,
  p4:    z => pos(z)[0] <= 4,
  main:  z => { const c = pos(z)[1]; return c <= 2 || c >= 13; },
  trans: z => { const c = pos(z)[1]; return c >= 6 && c <= 12; },
};

const $ = id => document.getElementById(id);
const tableEl = $('table');
const cellEls = {};

// ---------- Construcció de la taula ----------
function buildTable() {
  tableEl.innerHTML = '';
  const put = (el, r, c) => { el.style.gridRow = r + 1; el.style.gridColumn = c + 1; tableEl.appendChild(el); };
  for (let c = 1; c <= 17; c++) { const h = document.createElement('div'); h.className = 'hdr'; h.textContent = c; put(h, 0, c); }
  for (let r = 1; r <= 6; r++) { const h = document.createElement('div'); h.className = 'hdr'; h.textContent = r; put(h, r, 0); }
  for (const [r, c] of BLANKS) { const d = document.createElement('div'); d.className = 'cell blank'; put(d, r, c); }
  for (const e of ELS) {
    const d = document.createElement('div'); d.className = 'cell';
    const [r, c] = pos(e.z); put(d, r, c); cellEls[e.z] = d;
  }
}

// ---------- Estat del joc ----------
let queue = [], total = 0, doneCount = 0, firstTry = 0;
let cur = null, attempts = 0, solved = false, requeued = new Set();

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function chHtml(e) {
  const neg = e.ch.filter(v => v < 0).map(v => '<i class="n">' + fmtCh(v) + '</i>').join('');
  const pos = e.ch.filter(v => v > 0).map(v => '<i class="p">' + fmtCh(v) + '</i>').join('');
  return '<span class="cs">' + neg + '<span class="pp">' + pos + '</span></span>';
}
function setCell(z, state) {
  const d = cellEls[z], e = BY_Z[z];
  d.className = 'cell' + (state ? ' ' + state : '');
  d.removeAttribute('title');
  if (state === 'ok' || state === 'mid' || state === 'ko') {
    d.innerHTML = chHtml(e) + '<span class="s">' + e.sym + '</span>';
    d.title = e.name + ' · ' + e.z;
  } else d.innerHTML = '';
}

function start() {
  const inScope = SCOPES[$('scope').value];
  for (const e of ELS) setCell(e.z, inScope(e.z) ? '' : 'off');
  queue = shuffle(ELS.filter(e => inScope(e.z)).map(e => e.z));
  total = queue.length; doneCount = 0; firstTry = 0; requeued = new Set(); cur = null;
  $('done').classList.remove('show'); $('quiz').style.display = '';
  updateStats(); next();
}

function updateStats() {
  $('stDone').textContent = doneCount; $('stTotal').textContent = total; $('stFirst').textContent = firstTry;
  $('bar').style.width = total ? (100 * doneCount / total) + '%' : '0';
}

function next() {
  if (cur) { const d = cellEls[cur.z]; if (d.classList.contains('cur')) setCell(cur.z, ''); }
  if (!queue.length) return finish();
  cur = BY_Z[queue.shift()]; attempts = 0; solved = false;
  const [r, c] = pos(cur.z);
  cellEls[cur.z].className = 'cell cur'; cellEls[cur.z].innerHTML = '';
  const where = 'Grup ' + c + ' · Període ' + r;
  $('where').innerHTML = 'Quina casella és la que brilla?<small>' + where + '</small>';
  $('form').reset();
  for (const id of ['fSym', 'fCh', 'fName', 'fZ']) { const f = $(id); f.className = 'field'; f.querySelector('.note').textContent = ''; }
  chipEls.forEach(b => setChip(b, false));
  showMsg('');
  $('btnMain').textContent = 'Comprova'; $('btnSolve').disabled = false; $('btnSkip').disabled = false;
  $('inSym').focus({ preventScroll: true });
}

function finish() {
  $('quiz').style.display = 'none'; $('done').classList.add('show');
  $('doneTxt').textContent = 'Has encertat ' + firstTry + ' de ' + total + ' caselles al primer intent.';
  updateStats();
}

// ---------- Entrada ----------
const chipEls = [];
(function buildChips() {
  const rows = { neg: $('chNeg'), pos: $('chPos') };
  for (const v of [-4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 7]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip ' + (v < 0 ? 'n' : 'p'); b.dataset.v = v;
    b.textContent = fmtCh(v); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { if (!solved) setChip(b, b.getAttribute('aria-pressed') !== 'true'); });
    (v < 0 ? rows.neg : rows.pos).appendChild(b); chipEls.push(b);
  }
})();
function setChip(b, on) { b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
const readCharges = () => chipEls.filter(b => b.getAttribute('aria-pressed') === 'true').map(b => +b.dataset.v);

$('inSym').addEventListener('input', e => {
  const v = e.target.value.replace(/[^A-Za-z]/g, '');
  e.target.value = v ? v[0].toUpperCase() + v.slice(1).toLowerCase() : '';
});

function fmtCh(n) { return n > 0 ? '+' + n : '−' + Math.abs(n); }
const norm = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[·.\-'’\s]/g, '');
function mark(id, ok, note) {
  const f = $(id); f.classList.remove('ok', 'ko'); f.classList.add(ok ? 'ok' : 'ko');
  f.querySelector('.note').textContent = note || '';
}
function showMsg(t, kind) { const m = $('msg'); m.className = 'msg' + (t ? ' show ' + kind : ''); m.textContent = t; }

function grade() {
  const res = {};
  const sym = $('inSym').value.trim();
  res.sym = sym === cur.sym;
  const nm = $('inName').value.trim();
  res.name = !!nm && norm(nm) === norm(cur.name);
  res.nameExact = res.name && nm.toLowerCase() === cur.name;
  const z = parseInt($('inZ').value, 10);
  res.z = z === cur.z;
  const got = readCharges().sort((a, b) => a - b);
  res.ch = got.length === cur.ch.length && got.every((v, i) => v === cur.ch[i]);
  return res;
}

function solutionText() {
  const ch = cur.ch.map(fmtCh).join(' ');
  return cur.sym + ' · ' + cur.name + ' · ' + cur.z + ' protons · ' + ch;
}

function check() {
  attempts++;
  const r = grade();
  mark('fSym', r.sym, r.sym ? '' : 'Torna-ho a provar');
  mark('fName', r.name, r.name ? (r.nameExact ? '' : 'Ortografia: ' + cur.name) : 'Torna-ho a provar');
  mark('fZ', r.z, r.z ? '' : 'Torna-ho a provar');
  mark('fCh', r.ch, r.ch ? '' : 'Torna-ho a provar · en té ' + cur.ch.length);
  if (r.sym && r.name && r.z && r.ch) {
    solved = true;
    const first = attempts === 1;
    if (first) firstTry++;
    setCell(cur.z, first ? 'ok' : 'mid'); doneCount++; updateStats();
    showMsg((first ? 'Correcte! ' : 'Ja ho tens! ') + solutionText(), 'good');
    toNextMode();
  } else {
    showMsg('Alguna cosa no quadra. Corregeix els camps en vermell o mira la solució.', 'bad');
  }
}

function skip() {
  queue.push(cur.z);
  next();
}

function reveal() {
  $('inSym').value = cur.sym; $('inName').value = cur.name; $('inZ').value = cur.z;
  mark('fSym', true); mark('fName', true); mark('fZ', true);
  chipEls.forEach(b => setChip(b, cur.ch.includes(+b.dataset.v))); mark('fCh', true);
  setCell(cur.z, 'ko'); doneCount++;
  if (!requeued.has(cur.z)) { requeued.add(cur.z); queue.push(cur.z); total++; }
  updateStats();
  solved = true;
  showMsg('Solució: ' + solutionText() + ' (tornarà a sortir al final)', 'info');
  toNextMode();
}

function toNextMode() {
  $('btnMain').textContent = queue.length ? 'Següent' : 'Acaba';
  $('btnSolve').disabled = true; $('btnSkip').disabled = true;
  $('btnMain').focus({ preventScroll: true });
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (solved) next(); else check();
});
$('btnSolve').addEventListener('click', () => { if (!solved) reveal(); });
$('btnSkip').addEventListener('click', () => { if (!solved) skip(); });
$('btnAgain').addEventListener('click', start);
$('restart').addEventListener('click', start);
$('scope').addEventListener('change', start);

buildTable();
start();
</script>
</body>
</html>
