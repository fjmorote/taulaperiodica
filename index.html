<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taula periòdica · Joc</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #1c2230;
    --muted: #566074;
    --line: #d9dde5;
    --accent: #3b5bdb;
    --accent-ink: #ffffff;
    --ok: #2b8a3e;
    --ok-bg: #e3f4e7;
    --mid: #7048e8;
    --mid-bg: #f3efff;
    --ko: #c92a2a;
    --ko-bg: #fde4e4;
    --cell: #fbeccd;
    --neg: #1864ab;
    --pos: #c92a2a;
    --cell-off: #f3f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b2029;
      --ink: #e8ebf2;
      --muted: #98a1b3;
      --line: #2e3544;
      --accent: #748ffc;
      --accent-ink: #0f1320;
      --ok: #69db7c;
      --ok-bg: #1d3a26;
      --mid: #b197fc;
      --mid-bg: #2d2547;
      --ko: #ff8787;
      --ko-bg: #402022;
      --cell: #3a3322;
      --neg: #74c0fc;
      --pos: #ff8787;
      --cell-off: #1a1e27;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  .app > * { min-width: 0; }
  .board { order: 1; }
  .panel { order: 2; }
  @media (min-width: 1000px) {
    .app { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
    .panel { position: sticky; top: 16px; }
  }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls select { flex: 1 1 150px; min-width: 0; }
  .controls button { flex: 0 0 auto; }
  .chk { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; }
  .chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .chk:hover { border-color: var(--accent); }
  #restart .short { display: none; }
  @media (max-width: 600px) {
    .controls { width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); }
    .controls #level, .controls #order { grid-column: span 6; }
    .controls #scope { grid-column: 1 / -1; }
    .controls .chk { grid-column: span 5; padding: 0 10px; }
    .controls #btnRank { grid-column: span 5; padding: 9px 6px; }
    .controls #restart { grid-column: span 2; padding: 9px 0; }
    #restart .long { display: none; }
    #restart .short { display: inline; font-size: 1.3rem; line-height: 1; }
    header { gap: 8px; }
  }
  .hint { grid-column: 1 / -1; margin: -8px 0 0; color: var(--muted); font-size: .9rem; }
  select, button, input { font: inherit; color: inherit; }
  select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 44px;
  }
  button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--line); }
  button.primary:disabled:hover { border-color: var(--accent); }
  #btnSave:disabled { opacity: 1; cursor: default; background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px;
  }

  /* ---------- Taula ---------- */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; container-type: inline-size; }
  .table {
    display: grid;
    --cols: 18; --n: 19;
    grid-template-columns: max(1.2em, 12px) repeat(var(--cols), minmax(0, 1fr));
    grid-template-rows: max(1.2em, 12px) repeat(7, auto) 0.5em repeat(2, auto);
    gap: 2px;
    font-size: calc(100cqw / var(--n) * 0.26);
  }
  .table.sheet { --cols: 17; --n: 18; grid-template-rows: max(1.2em, 12px) repeat(6, auto); }
  .cell.gone { display: none; }
  .cell.ph { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: .7em; align-items: center; justify-content: center; text-align: center; }
  .cell.approx .cs { font-style: italic; }
  .hdr { color: var(--muted); display: grid; place-items: center; font-size: max(8px, 1em); }
  .cell {
    aspect-ratio: 3 / 4; border-radius: 3px; background: var(--cell);
    display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
    padding: 2px 3px; line-height: 1.05; overflow: hidden; border: 1px solid transparent; min-width: 0;
  }
  .cell.off { opacity: .35; }
  .cell.blank { background: var(--surface); border: 1px solid var(--line); }
  .cell .s { font-weight: 700; font-size: max(9px, 1.5em); }
  .cell .cs { display: flex; justify-content: space-between; gap: .3em; font-size: .8em; }
  .cell .cs .col { display: flex; flex-direction: column; }
  .cell .cs .col:first-child { align-items: flex-start; }
  .cell .cs .col:last-child { align-items: flex-end; }
  .cell .cs i { font-style: normal; }
  .cell .cs .n { color: var(--neg); }
  .cell .cs .p { color: var(--pos); }
  .cell.ok  { background: var(--ok-bg);  border-color: var(--ok); }
  .cell.mid { background: var(--mid-bg); border-color: var(--mid); }
  .cell.ko  { background: var(--ko-bg);  border-color: var(--ko); }
  .cell.cur {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    animation: pulse 1.2s ease-in-out infinite; z-index: 1; align-items: center; justify-content: center;
  }
  .cell.cur::after { content: "?"; font-weight: 800; font-size: max(11px, 1.9em); }
  @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .cell.cur { animation: none; } }
  @container (max-width: 640px) { .cell .cs { display: none; } .cell { align-items: center; justify-content: center; padding: 0; } .cell .s { letter-spacing: -.04em; } .table.full .cell .s { font-size: max(8.5px, 1.5em); letter-spacing: -.07em; } }
  @media (max-width: 600px) { .board { padding: 8px; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
  .legend i { display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }

  /* ---------- Panell ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  .stats { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .9rem; }
  .stats b { color: var(--ink); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .jump { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: .9rem; }
  .jump b { color: var(--ink); }
  .jump select { flex: 1 1 170px; min-width: 0; }
  .where { font-weight: 600; font-size: 1.05rem; }
  .where small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  form { display: grid; gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field > label, .field > .lbl { font-size: .85rem; color: var(--muted); }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 1.1rem;
  }
  .field.ok input { border-color: var(--ok); background: var(--ok-bg); }
  .field.ko input { border-color: var(--ko); background: var(--ko-bg); }
  .field.ok .seg label.on { background: var(--ok); border-color: var(--ok); }
  .field.ko .seg label.on { background: var(--ko); border-color: var(--ko); }
  .field .note { font-size: .8rem; min-height: 0; }
  .field.ok .note { color: var(--ok); }
  .field.ko .note { color: var(--ko); }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zone {
    display: grid; align-content: start; gap: 2px; min-height: 104px; padding: 6px 8px; text-align: left;
    background: var(--cell); border: 2px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .zone small { color: var(--muted); font-weight: 400; font-size: .75rem; }
  .zone .v { font-size: 1.05rem; line-height: 1.2; }
  .zone .v.n { color: var(--neg); }
  .zone .v.p { color: var(--pos); }
  .zone[data-side=r] { text-align: right; justify-items: end; }
  .zone[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .field.ok .zone { border-color: var(--ok); }
  .field.ko .zone.bad { border-color: var(--ko); background: var(--ko-bg); }
  .field.ok .zone.good, .field.ko .zone.good { border-color: var(--ok); }
  .chips { display: grid; gap: 6px; margin-top: 8px; }
  .chiprow { display: flex; gap: 4px; }
  .chip {
    flex: 1 1 0; min-width: 0; padding: 0; min-height: 44px; font-weight: 700; font-size: 1.05rem;
    border: 2px solid var(--line); background: var(--bg);
  }
  .chip.n { color: var(--neg); }
  .chip.p { color: var(--pos); }
  .chip[aria-pressed=true].n { background: var(--neg); border-color: var(--neg); color: #fff; }
  .chip[aria-pressed=true].p { background: var(--pos); border-color: var(--pos); color: #fff; }
  .clear { justify-self: start; min-height: 36px; padding: 4px 10px; font-size: .85rem; margin-top: 6px; }
  .field.disabled { opacity: .55; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 999px) {
    html { scroll-padding-bottom: 84px; }
    #form .actions button { padding: 9px 10px; flex: 1 1 auto; }
    #form .actions .primary { flex: 2 1 110px; }
    #form .actions { position: sticky; bottom: 0; z-index: 3; background: var(--surface); padding: 10px 0 4px; box-shadow: 0 -10px 10px -10px rgba(0, 0, 0, .35); }
  }
  .actions .primary { flex: 1 1 140px; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }
  .msg.show { display: block; }
  .msg.good { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--ko-bg); color: var(--ko); }
  .msg.info { background: var(--mid-bg); color: var(--mid); }
  .done { text-align: center; display: none; gap: 12px; }
  .done h2 { margin: 0; }
  .done h2:focus { outline: none; }
  .done p { margin: 0; color: var(--muted); }
  .big { font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .saveForm { display: flex; flex-wrap: wrap; gap: 8px; }
  .saveForm button { white-space: nowrap; flex: 1 1 auto; }
  .saveForm input { flex: 1 1 160px; width: 0; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 1rem; }
  .rank { width: 100%; border-collapse: collapse; font-size: .9rem; text-align: left; }
  .rank th { color: var(--muted); font-weight: 500; font-size: .75rem; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .rank td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .rank td:first-child, .rank th:first-child { width: 2em; text-align: center; }
  .rank td.r, .rank th.r { text-align: right; white-space: nowrap; }
  .rank tr.me td { background: var(--ok-bg); font-weight: 700; }
  .rank .nm { overflow-wrap: anywhere; }
  .rankhead { color: var(--muted); font-size: .8rem; text-align: left; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
  dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { margin: 0 0 10px; font-size: 1.2rem; }
  .rankSel { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .done.show { display: grid; }
  [hidden] { display: none !important; }
  .cell.cur.sym::after { content: none; }
  .cell.cur .s { font-size: max(11px, 1.9em); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Taula periòdica · Joc</h1>
    <div class="controls">
      <label class="sr" for="level">Nivell</label>
      <select id="level">
        <option value="basic">Nivell: Bàsic</option>
        <option value="medium">Nivell: Mitjà</option>
        <option value="adv">Nivell: Avançat</option>
        <option value="expert">Nivell: Expert</option>
      </select>
      <label class="sr" for="order">Ordre</label>
      <select id="order">
        <option value="random">Ordre: aleatori</option>
        <option value="rows">Ordre: files</option>
        <option value="cols">Ordre: columnes</option>
      </select>
      <label class="sr" for="scope">Abast</label>
      <select id="scope">
        <optgroup label="Taula completa (118)">
          <option value="full" selected>Completa · tota (118)</option>
          <option value="fmain">Completa · grups principals</option>
          <option value="ftrans">Completa · metalls de transició</option>
          <option value="ff">Completa · lantànids i actínids</option>
        </optgroup>
        <optgroup label="Taula del full (47)">
          <option value="all">Full · tota (47)</option>
          <option value="p3">Full · períodes 1–3</option>
          <option value="p4">Full · períodes 1–4</option>
          <option value="main">Full · grups principals</option>
          <option value="trans">Full · metalls de transició</option>
        </optgroup>
      </select>
      <label class="chk" title="Demana també els protons"><input type="checkbox" id="chkZ"><span>Protons</span></label>
      <button id="btnRank" type="button">🏆 Rànquing</button>
      <button id="restart" type="button" aria-label="Reinicia"><span class="long">Reinicia</span><span class="short" aria-hidden="true">↻</span></button>
    </div>
  </header>
  <p class="hint" id="levelHint"></p>

  <section class="panel">
    <div id="prog" style="display:grid;gap:14px">
      <div class="stats">
        <span id="stProg"></span>
        <span>Al primer intent: <b id="stFirst">0</b></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </div>

    <div id="quiz">
      <div class="jump" id="jump" hidden>
        <span id="jumpCur"></span>
        <label class="sr" for="jumpSel" id="jumpLbl">Canvia de fila</label>
        <select id="jumpSel"></select>
      </div>
      <div class="where" id="where" aria-live="polite"></div>
      <form id="form" autocomplete="off" novalidate>
        <div class="field" id="fSym">
          <label for="inSym">Símbol</label>
          <input type="text" id="inSym" maxlength="3" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fName">
          <label for="inName">Nom (en català)</label>
          <input type="text" id="inName" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fCh">
          <span class="lbl" id="lblCh">+/− · toca una columna i afegeix-hi els valors en l'ordre de la taula (de dalt a baix)</span>
          <div class="zones" role="group" aria-labelledby="lblCh">
            <button type="button" class="zone" id="zL" data-side="l" aria-pressed="true"><small>Esquerra</small><span class="vals"></span></button>
            <button type="button" class="zone" id="zR" data-side="r" aria-pressed="false"><small>Dreta</small><span class="vals"></span></button>
          </div>
          <div class="chips" aria-label="Valors">
            <div class="chiprow" id="chNeg"></div>
            <div class="chiprow" id="chPos"></div>
          </div>
          <button type="button" class="clear" id="btnClear">Esborra la columna seleccionada</button>
          <div class="note"></div>
        </div>
        <div class="field" id="fZ">
          <label for="inZ">Protons</label>
          <input type="number" id="inZ" min="1" max="118" inputmode="numeric">
          <div class="note"></div>
        </div>
        <div class="msg" id="msg" role="status"></div>
        <div class="actions">
          <button class="primary" id="btnMain" type="submit">Comprova</button>
          <button id="btnSolve" type="button">Solució</button>
          <button id="btnSkip" type="button">Salta</button>
        </div>
      </form>
    </div>

    <div class="done" id="done">
      <h2 id="doneTitle">Primera ronda acabada! 🎉</h2>
      <div class="big" id="doneBig"></div>
      <p id="doneTxt"></p>
      <form class="saveForm" id="saveForm" autocomplete="off">
        <label class="sr" for="inPlayer">Nom per al rànquing (si el deixes buit: Jugador)</label>
        <input id="inPlayer" maxlength="20" placeholder="Nom (opcional)">
        <button class="primary" id="btnSave" type="submit">Desa al rànquing</button>
      </form>
      <p id="savedTxt" role="status"></p>
      <div class="rankhead" id="doneRankHead"></div>
      <div id="doneRank"></div>
      <div class="actions">
        <button id="btnReview" type="button">Repassa els errors</button>
        <button id="btnAgain" type="button">Torna a jugar</button>
      </div>
    </div>
  </section>

  <section class="board">
    <div class="table" id="table" role="img" aria-label="Taula periòdica"></div>
    <div class="legend">
      <span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Al primer intent</span>
      <span><i style="background:var(--mid-bg);border-color:var(--mid)"></i>Amb errors</span>
      <span><i style="background:var(--ko-bg);border-color:var(--ko)"></i>Solució / saltat</span>
    </div>
  </section>
</main>

<dialog id="rankDlg" aria-labelledby="rankTitle">
  <h2 id="rankTitle">🏆 Rànquing per dificultat</h2>
  <div class="rankSel">
    <select id="rkLevel" aria-label="Nivell"></select>
    <select id="rkScope" aria-label="Abast"></select>
  </div>
  <div id="rankBox"></div>
  <div class="actions" style="margin-top:12px">
    <button type="button" id="btnRankClear">Esborra aquest rànquing</button>
    <button type="button" class="primary" id="btnRankClose">Tanca</button>
  </div>
</dialog>

<script>
'use strict';

// [nº atòmic, símbol, nom en català (IEC), columna esquerra, columna dreta, fora del full]
// Cada columna es llegeix de dalt a baix, tal com surt a la taula del full.
// 6è valor: 1 = element que NO surt al full (valors orientatius: només es comprova el conjunt de +/−);
//           2 = element sense +/− (gasos nobles i elements sense química fiable).
const DATA = [
  [1,'H','hidrogen',[-1],[1]],[2,'He','heli',[],[],2],[3,'Li','liti',[],[1]],[4,'Be','beril·li',[],[2]],
  [5,'B','bor',[-3],[3]],[6,'C','carboni',[-4],[2,4]],[7,'N','nitrogen',[-3],[1,3,5,2]],[8,'O','oxigen',[-2,-1],[]],
  [9,'F','fluor',[-1],[]],[10,'Ne','neó',[],[],2],[11,'Na','sodi',[],[1]],[12,'Mg','magnesi',[],[2]],
  [13,'Al','alumini',[],[3]],[14,'Si','silici',[-4],[2,4]],[15,'P','fòsfor',[-3],[3,5]],[16,'S','sofre',[-2],[2,4,6]],
  [17,'Cl','clor',[-1],[1,3,5,7]],[18,'Ar','argó',[],[],2],[19,'K','potassi',[],[1]],[20,'Ca','calci',[],[2]],
  [21,'Sc','escandi',[],[3],1],[22,'Ti','titani',[],[2,3,4],1],[23,'V','vanadi',[],[2,3,4,5],1],[24,'Cr','crom',[6],[2,3]],
  [25,'Mn','manganès',[6,7],[2,3,4]],[26,'Fe','ferro',[],[2,3]],[27,'Co','cobalt',[],[2,3]],[28,'Ni','níquel',[],[2,3]],
  [29,'Cu','coure',[],[1,2]],[30,'Zn','zinc',[],[2]],[31,'Ga','gal·li',[],[3]],[32,'Ge','germani',[-4],[2,4]],
  [33,'As','arsènic',[-3],[3,5]],[34,'Se','seleni',[-2],[2,4,6]],[35,'Br','brom',[-1],[1,3,5,7]],[36,'Kr','criptó',[],[],2],

    sel.l = cur.l.slice(); sel.r = cur.r.slice(); renderZones(); mark('fCh', true);
    zoneEl.l.classList.add('good'); zoneEl.r.classList.add('good');
  }
  setCell(cur.z, 'ko'); doneCount++;
  resolved.add(cur.z);
  if (!requeued.has(cur.z)) { requeued.add(cur.z); queue.push(cur.z); total++; }
  checkRound();
  updateStats();
  solved = true;
  showMsg('Solució: ' + solutionText() + ' (tornarà a sortir al final)', 'info');
  toNextMode();
}

function toNextMode() {
  $('btnMain').textContent = (roundDone && !roundShown) ? 'Veure resultats' : (queue.length ? 'Següent' : 'Acaba');
  $('btnSolve').disabled = true; $('btnSkip').disabled = true;
  $('btnMain').focus({ preventScroll: true });
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (solved) next(); else check();
});
$('btnSolve').addEventListener('click', () => { if (!solved) reveal(); });
$('btnSkip').addEventListener('click', () => { if (!solved) skip(); });
const unsaved = () => roundShown && round && !savedEntry;
const DISCARD_MSG = 'Encara no has desat aquest resultat al rànquing. Vols començar de nou igualment?';
$('btnAgain').addEventListener('click', () => { if (unsaved() && !confirm(DISCARD_MSG)) return; start(); });
$('restart').addEventListener('click', () => { if (unsaved() && !confirm(DISCARD_MSG)) return; start(); });
const restoreSel = () => { for (const k of ['level', 'order', 'scope']) $(k).value = lastSel[k]; $('chkZ').checked = lastSel.z; };
const changed = fn => () => {
  if (unsaved() && !confirm(DISCARD_MSG)) return restoreSel();
  fn(); saveSettings(); start();
};
$('level').addEventListener('change', changed(() => { $('chkZ').checked = LEVEL_Z[$('level').value]; }));
$('order').addEventListener('change', changed(() => {}));
$('scope').addEventListener('change', changed(() => {}));
$('chkZ').addEventListener('change', changed(syncLevelToZ));

// ---------- Rànquing (guardat al navegador d'aquest dispositiu) ----------
const RANK_KEY = 'taulaperiodica.ranking.v1', PLAYER_KEY = 'taulaperiodica.player';
const LEVEL_NAME = { basic: 'Bàsic', basicz: 'Bàsic + protons', medium: 'Mitjà', adv: 'Avançat', expertnz: 'Expert sense protons', expert: 'Expert' };
let rankMem = [];
try { const a = JSON.parse(localStorage.getItem(RANK_KEY) || '[]'); if (Array.isArray(a)) rankMem = a; } catch (e) {}
function persistRank() { try { localStorage.setItem(RANK_KEY, JSON.stringify(rankMem)); return true; } catch (e) { return false; } }
const cmpRun = (a, b) => (b.correct / b.n) - (a.correct / a.n) || (a.ms / a.n) - (b.ms / b.n) || a.t - b.t;
const entriesFor = (level, scope) => rankMem.filter(e => e.level === level && e.scope === scope).sort(cmpRun);
const fmtTime = ms => { const t = Math.round(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const pct = (c, n) => Math.round(100 * c / n);
const scopeName = v => { const o = [...$('scope').options].find(o => o.value === v); return o ? o.textContent : v; };

function renderRank(box, level, scope, hiId) {
  box.replaceChildren();
  const list = entriesFor(level, scope);
  if (!list.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Encara no hi ha cap resultat en aquest nivell.'; box.appendChild(d); return; }
  const tbl = document.createElement('table'); tbl.className = 'rank';
  const head = document.createElement('tr');
  for (const [t, cls] of [['#', ''], ['Nom', ''], ['Encerts', 'r'], ['Temps', 'r']]) { const th = document.createElement('th'); th.textContent = t; if (cls) th.className = cls; head.appendChild(th); }
  tbl.appendChild(head);
  const rows = list.map((e, i) => ({ e, pos: i + 1 }));
  let shown = rows.slice(0, 10);
  const me = rows.find(r => r.e.id === hiId);
  if (me && !shown.includes(me)) shown = shown.concat(me);
  for (const { e, pos } of shown) {
    const tr = document.createElement('tr'); if (e.id === hiId) tr.className = 'me';
    const cells = [[pos, ''], [e.name, 'nm'], [e.correct + '/' + e.n + ' · ' + pct(e.correct, e.n) + '%', 'r'], [fmtTime(e.ms), 'r']];
    for (const [t, cls] of cells) { const td = document.createElement('td'); td.textContent = t; if (cls) td.className = cls; tr.appendChild(td); }
    tbl.appendChild(tr);
  }
  box.appendChild(tbl);
}

function showResults() {
  const first = !roundShown; roundShown = true;
  if (!round) checkRound();
  const R = round;
  $('quiz').style.display = 'none'; $('done').classList.add('show'); $('prog').hidden = true;
  $('btnAgain').classList.toggle('primary', !!savedEntry);
  $('doneTitle').textContent = first ? 'Primera ronda acabada! 🎉' : 'Repàs acabat 👏';
  $('doneBig').textContent = R.correct + '/' + R.n + ' · ' + pct(R.correct, R.n) + '%';
  $('doneTxt').textContent = 'Nivell ' + LEVEL_NAME[R.level] + ' · ' + scopeName(R.scope) + ' · ' + fmtTime(R.ms) + ' · al primer intent';
  $('inPlayer').value = (() => { try { return localStorage.getItem(PLAYER_KEY) || ''; } catch (e) { return ''; } })();
  $('btnSave').disabled = !!savedEntry; $('btnSave').textContent = savedEntry ? 'Desat ✓' : 'Desa al rànquing';
  $('saveForm').style.display = '';
  updateDoneRank();
  $('btnReview').style.display = queue.length ? '' : 'none';
  $('btnReview').textContent = 'Repassa els errors (' + queue.length + ')';
  $('doneTitle').tabIndex = -1; $('doneTitle').focus({ preventScroll: true });
}
function updateDoneRank() {
  const R = round;
  let preview = '';
  if (!savedEntry) {
    const better = entriesFor(R.level, R.scope).filter(e => cmpRun(e, R) < 0).length;
    preview = 'Si el deses, quedaràs en la posició ' + (better + 1) + '.';
  } else {
    preview = 'Posició ' + (entriesFor(R.level, R.scope).findIndex(e => e.id === savedEntry.id) + 1) + ' al rànquing.';
  }
  $('savedTxt').textContent = preview;
  $('doneRankHead').textContent = 'Rànquing · ' + LEVEL_NAME[R.level] + ' · ' + scopeName(R.scope);
  renderRank($('doneRank'), R.level, R.scope, savedEntry && savedEntry.id);
}
$('saveForm').addEventListener('submit', e => {
  e.preventDefault();
  if (savedEntry || !round) return;
  const name = $('inPlayer').value.trim() || 'Jugador';
  savedEntry = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), t: Date.now(), name, level: round.level, scope: round.scope, order: round.order, n: round.n, correct: round.correct, ms: round.ms };
  rankMem.push(savedEntry);
  // màxim 100 resultats per nivell i abast
  const keep = new Set(entriesFor(round.level, round.scope).slice(0, 100).map(x => x.id));
  rankMem = rankMem.filter(x => x.level !== round.level || x.scope !== round.scope || keep.has(x.id));
  const ok = persistRank();
  try { localStorage.setItem(PLAYER_KEY, name); } catch (e) {}
  $('btnSave').disabled = true; $('btnSave').textContent = 'Desat ✓'; $('btnAgain').classList.add('primary');
  updateDoneRank();
  if (!ok) $('savedTxt').textContent += ' (No s\'ha pogut desar al navegador: es perdrà en tancar.)';
});
$('btnReview').addEventListener('click', () => { $('done').classList.remove('show'); $('quiz').style.display = ''; $('prog').hidden = false; next(); updateStats(); });

// Diàleg del rànquing (tots els nivells)
const dlg = $('rankDlg');
for (const k of Object.keys(LEVEL_NAME)) $('rkLevel').add(new Option(LEVEL_NAME[k], k));
for (const o of $('scope').options) $('rkScope').add(new Option(o.textContent, o.value));
const drawDlg = () => renderRank($('rankBox'), $('rkLevel').value, $('rkScope').value, null);
$('btnRank').addEventListener('click', () => {
  $('rkLevel').value = diffKey(); $('rkScope').value = $('scope').value; drawDlg();
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
});
$('rkLevel').addEventListener('change', drawDlg); $('rkScope').addEventListener('change', drawDlg);
$('btnRankClose').addEventListener('click', () => dlg.close());
$('btnRankClear').addEventListener('click', () => {
  const lv_ = $('rkLevel').value, sc = $('rkScope').value;
  if (!entriesFor(lv_, sc).length) return;
  if (!confirm('Vols esborrar el rànquing ' + LEVEL_NAME[lv_] + ' · ' + $('rkScope').selectedOptions[0].textContent + '?')) return;
  rankMem = rankMem.filter(x => x.level !== lv_ || x.scope !== sc); persistRank(); drawDlg();
  if (round && round.level === lv_ && round.scope === sc) { savedEntry = null; if ($('done').classList.contains('show')) showResults(); }
});

buildTable();
start();
</script>
</body>
</html>
