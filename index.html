<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taula periòdica · Joc</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #1c2230;
    --muted: #6a7385;
    --line: #d9dde5;
    --accent: #3b5bdb;
    --accent-ink: #ffffff;
    --ok: #2b8a3e;
    --ok-bg: #e3f4e7;
    --mid: #b36b00;
    --mid-bg: #fff1d6;
    --ko: #c92a2a;
    --ko-bg: #fde4e4;
    --cell: #fbeccd;
    --neg: #1c7ed6;
    --pos: #e03131;
    --cell-off: #f3f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #1b2029;
      --ink: #e8ebf2;
      --muted: #98a1b3;
      --line: #2e3544;
      --accent: #748ffc;
      --accent-ink: #0f1320;
      --ok: #69db7c;
      --ok-bg: #1d3a26;
      --mid: #ffc078;
      --mid-bg: #3d2f14;
      --ko: #ff8787;
      --ko-bg: #402022;
      --cell: #3a3322;
      --neg: #74c0fc;
      --pos: #ff8787;
      --cell-off: #1a1e27;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .app { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  .board { order: 1; }
  .panel { order: 2; }
  @media (min-width: 1000px) {
    .app { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
    .panel { position: sticky; top: 16px; }
  }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls select { flex: 1 1 150px; min-width: 0; }
  .controls button { flex: 0 0 auto; }
  @media (max-width: 600px) { .controls { width: 100%; } .controls button { flex: 1 1 45%; min-height: 40px; } header { gap: 8px; } }
  select, button, input { font: inherit; color: inherit; }
  select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px;
  }

  /* ---------- Taula ---------- */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; container-type: inline-size; }
  .table {
    display: grid;
    grid-template-columns: 1.2em repeat(17, minmax(0, 1fr));
    grid-template-rows: 1.2em repeat(6, auto);
    gap: 2px;
    font-size: calc(100cqw / 18 * 0.26);
  }
  .hdr { color: var(--muted); display: grid; place-items: center; font-size: 1em; }
  .cell {
    aspect-ratio: 3 / 4; border-radius: 3px; background: var(--cell);
    display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
    padding: 2px 3px; line-height: 1.05; overflow: hidden; border: 1px solid transparent; min-width: 0;
  }
  .cell.off { opacity: .35; }
  .cell.blank { background: var(--surface); border: 1px solid var(--line); }
  .cell .s { font-weight: 700; font-size: 1.5em; }
  .cell .cs { display: flex; justify-content: space-between; gap: .3em; font-size: .8em; }
  .cell .cs .col { display: flex; flex-direction: column; }
  .cell .cs .col:first-child { align-items: flex-start; }
  .cell .cs .col:last-child { align-items: flex-end; }
  .cell .cs i { font-style: normal; }
  .cell .cs .n { color: var(--neg); }
  .cell .cs .p { color: var(--pos); }
  .cell.ok  { background: var(--ok-bg);  border-color: var(--ok); }
  .cell.mid { background: var(--mid-bg); border-color: var(--mid); }
  .cell.ko  { background: var(--ko-bg);  border-color: var(--ko); }
  .cell.cur {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    animation: pulse 1.2s ease-in-out infinite; z-index: 1; align-items: center; justify-content: center;
  }
  .cell.cur::after { content: "?"; font-weight: 800; font-size: 1.9em; }
  @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .cell.cur { animation: none; } }
  @container (max-width: 640px) { .cell .cs { display: none; } .cell { align-items: center; justify-content: center; } }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
  .legend i { display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }

  /* ---------- Panell ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  .stats { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .9rem; }
  .stats b { color: var(--ink); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .where { font-weight: 600; font-size: 1.05rem; }
  .where small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  form { display: grid; gap: 12px; }
  .field { display: grid; gap: 4px; }
  .field > label, .field > .lbl { font-size: .85rem; color: var(--muted); }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 1.1rem;
  }
  .field.ok input { border-color: var(--ok); background: var(--ok-bg); }
  .field.ko input { border-color: var(--ko); background: var(--ko-bg); }
  .field.ok .seg label.on { background: var(--ok); border-color: var(--ok); }
  .field.ko .seg label.on { background: var(--ko); border-color: var(--ko); }
  .field .note { font-size: .8rem; min-height: 0; }
  .field.ok .note { color: var(--ok); }
  .field.ko .note { color: var(--ko); }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .zone {
    display: grid; align-content: start; gap: 2px; min-height: 104px; padding: 6px 8px; text-align: left;
    background: var(--cell); border: 2px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  .zone small { color: var(--muted); font-weight: 400; font-size: .75rem; }
  .zone .v { font-size: 1.05rem; line-height: 1.2; }
  .zone .v.n { color: var(--neg); }
  .zone .v.p { color: var(--pos); }
  .zone[data-side=r] { text-align: right; justify-items: end; }
  .zone[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .field.ok .zone { border-color: var(--ok); }
  .field.ko .zone.bad { border-color: var(--ko); background: var(--ko-bg); }
  .field.ok .zone.good, .field.ko .zone.good { border-color: var(--ok); }
  .chips { display: grid; gap: 6px; margin-top: 8px; }
  .chiprow { display: flex; gap: 4px; }
  .chip {
    flex: 1 1 0; min-width: 0; padding: 0; min-height: 44px; font-weight: 700; font-size: 1.05rem;
    border: 2px solid var(--line); background: var(--bg);
  }
  .chip.n { color: var(--neg); }
  .chip.p { color: var(--pos); }
  .chip[aria-pressed=true].n { background: var(--neg); border-color: var(--neg); color: #fff; }
  .chip[aria-pressed=true].p { background: var(--pos); border-color: var(--pos); color: #fff; }
  .clear { justify-self: start; min-height: 36px; padding: 4px 10px; font-size: .85rem; margin-top: 6px; }
  .field.disabled { opacity: .55; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .primary { flex: 1 1 140px; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: .95rem; display: none; }
  .msg.show { display: block; }
  .msg.good { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--ko-bg); color: var(--ko); }
  .msg.info { background: var(--mid-bg); color: var(--mid); }
  .done { text-align: center; display: none; gap: 12px; }
  .done h2 { margin: 0; }
  .done p { margin: 0; color: var(--muted); }
  .big { font-size: 2rem; font-weight: 800; line-height: 1.1; }
  .saveForm { display: flex; gap: 8px; }
  .saveForm button { white-space: nowrap; }
  .saveForm input { flex: 1 1 auto; min-width: 0; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 1rem; }
  .rank { width: 100%; border-collapse: collapse; font-size: .9rem; text-align: left; }
  .rank th { color: var(--muted); font-weight: 500; font-size: .75rem; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .rank td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .rank td:first-child, .rank th:first-child { width: 2em; text-align: center; }
  .rank td.r, .rank th.r { text-align: right; white-space: nowrap; }
  .rank tr.me td { background: var(--ok-bg); font-weight: 700; }
  .rank .nm { overflow-wrap: anywhere; }
  .rankhead { color: var(--muted); font-size: .8rem; text-align: left; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 0; }
  dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 16px; width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { margin: 0 0 10px; font-size: 1.2rem; }
  .rankSel { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .done.show { display: grid; }
  [hidden] { display: none !important; }
  .cell.cur.sym::after { content: none; }
  .cell.cur .s { font-size: 1.9em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Taula periòdica · Joc</h1>
    <div class="controls">
      <label class="sr" for="level">Nivell</label>
      <select id="level">
        <option value="basic">Bàsic · veus el símbol → nom</option>
        <option value="medium">Mitjà · símbol + nom</option>
        <option value="adv">Avançat · símbol + nom + protons</option>
        <option value="expert">Expert · tot (amb esquerra/dreta)</option>
      </select>
      <label class="sr" for="order">Ordre</label>
      <select id="order">
        <option value="random">Ordre: aleatori</option>
        <option value="rows">Ordre: per files</option>
        <option value="cols">Ordre: per columnes</option>
      </select>
      <label class="sr" for="scope">Abast</label>
      <select id="scope">
        <option value="all">Tota la taula (47)</option>
        <option value="p3">Períodes 1–3</option>
        <option value="p4">Períodes 1–4</option>
        <option value="main">Només grups principals</option>
        <option value="trans">Només metalls de transició</option>
      </select>
      <button id="btnRank" type="button">🏆 Rànquing</button>
      <button id="restart" type="button">Reinicia</button>
    </div>
  </header>

  <section class="panel" aria-live="polite">
    <div class="stats">
      <span>Ronda: <b id="stDone">0</b>/<b id="stTotal">0</b></span>
      <span>Al primer intent: <b id="stFirst">0</b></span>
    </div>
    <div class="bar"><div id="bar"></div></div>

    <div id="quiz">
      <div class="where" id="where"></div>
      <form id="form" autocomplete="off" novalidate>
        <div class="field" id="fSym">
          <label for="inSym">Símbol</label>
          <input type="text" id="inSym" maxlength="3" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fCh">
          <span class="lbl" id="lblCh">+/− · toca una columna i afegeix-hi els valors en l'ordre de la taula (de dalt a baix)</span>
          <div class="zones" role="group" aria-labelledby="lblCh">
            <button type="button" class="zone" id="zL" data-side="l" aria-pressed="true"><small>Esquerra</small><span class="vals"></span></button>
            <button type="button" class="zone" id="zR" data-side="r" aria-pressed="false"><small>Dreta</small><span class="vals"></span></button>
          </div>
          <div class="chips" aria-label="Valors">
            <div class="chiprow" id="chNeg"></div>
            <div class="chiprow" id="chPos"></div>
          </div>
          <button type="button" class="clear" id="btnClear">Esborra la columna seleccionada</button>
          <div class="note"></div>
        </div>
        <div class="field" id="fName">
          <label for="inName">Nom (en català)</label>
          <input type="text" id="inName" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div class="note"></div>
        </div>
        <div class="field" id="fZ">
          <label for="inZ">Protons</label>
          <input type="number" id="inZ" min="1" max="118" inputmode="numeric">
          <div class="note"></div>
        </div>
        <div class="msg" id="msg" role="status"></div>
        <div class="actions">
          <button class="primary" id="btnMain" type="submit">Comprova</button>
          <button id="btnSolve" type="button">Solució</button>
          <button id="btnSkip" type="button">Salta</button>
        </div>
      </form>
    </div>

    <div class="done" id="done">
      <h2 id="doneTitle">Primera ronda acabada! 🎉</h2>
      <div class="big" id="doneBig"></div>
      <p id="doneTxt"></p>
      <form class="saveForm" id="saveForm" autocomplete="off">
        <input id="inPlayer" maxlength="20" placeholder="El teu nom" aria-label="El teu nom">
        <button class="primary" id="btnSave" type="submit">Desa al rànquing</button>
      </form>
      <p id="savedTxt" role="status"></p>
      <div class="rankhead" id="doneRankHead"></div>
      <div id="doneRank"></div>
      <div class="actions">
        <button id="btnReview" type="button">Repassa els errors</button>
        <button class="primary" id="btnAgain" type="button">Torna a jugar</button>
      </div>
    </div>
  </section>

  <section class="board">
    <div class="table" id="table" role="img" aria-label="Taula periòdica"></div>
    <div class="legend">
      <span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Al primer intent</span>
      <span><i style="background:var(--mid-bg);border-color:var(--mid)"></i>Amb errors</span>
      <span><i style="background:var(--ko-bg);border-color:var(--ko)"></i>Solució / saltat</span>
    </div>
  </section>
</div>

<dialog id="rankDlg" aria-labelledby="rankTitle">
  <h2 id="rankTitle">🏆 Rànquing per dificultat</h2>
  <div class="rankSel">
    <select id="rkLevel" aria-label="Nivell"></select>
    <select id="rkScope" aria-label="Abast"></select>
  </div>
  <div id="rankBox"></div>
  <div class="actions" style="margin-top:12px">
    <button type="button" id="btnRankClear">Esborra aquest rànquing</button>
    <button type="button" class="primary" id="btnRankClose">Tanca</button>
  </div>
</dialog>

<script>
'use strict';

// [nº atòmic, símbol, nom en català (IEC), columna esquerra, columna dreta]
// Cada columna es llegeix de dalt a baix, tal com surt a la taula del full.
const DATA = [
  [1,'H','hidrogen',[-1],[1]],
  [3,'Li','liti',[],[1]],[4,'Be','beril·li',[],[2]],[5,'B','bor',[-3],[3]],[6,'C','carboni',[-4],[2,4]],[7,'N','nitrogen',[-3],[1,3,5,2]],[8,'O','oxigen',[-2,-1],[]],[9,'F','fluor',[-1],[]],
  [11,'Na','sodi',[],[1]],[12,'Mg','magnesi',[],[2]],[13,'Al','alumini',[],[3]],[14,'Si','silici',[-4],[2,4]],[15,'P','fòsfor',[-3],[3,5]],[16,'S','sofre',[-2],[2,4,6]],[17,'Cl','clor',[-1],[1,3,5,7]],
  [19,'K','potassi',[],[1]],[20,'Ca','calci',[],[2]],[24,'Cr','crom',[6],[2,3]],[25,'Mn','manganès',[6,7],[2,3,4]],[26,'Fe','ferro',[],[2,3]],[27,'Co','cobalt',[],[2,3]],[28,'Ni','níquel',[],[2,3]],[29,'Cu','coure',[],[1,2]],[30,'Zn','zinc',[],[2]],
  [31,'Ga','gal·li',[],[3]],[32,'Ge','germani',[-4],[2,4]],[33,'As','arsènic',[-3],[3,5]],[34,'Se','seleni',[-2],[2,4,6]],[35,'Br','brom',[-1],[1,3,5,7]],
  [37,'Rb','rubidi',[],[1]],[38,'Sr','estronci',[],[2]],[46,'Pd','pal·ladi',[],[2,4]],[47,'Ag','plata',[],[1]],[48,'Cd','cadmi',[],[2]],[49,'In','indi',[],[3]],[50,'Sn','estany',[],[2,4]],[51,'Sb','antimoni',[-3],[3,5]],[52,'Te','tel·luri',[-2],[2,4,6]],[53,'I','iode',[-1],[1,3,5,7]],
  [55,'Cs','cesi',[],[1]],[56,'Ba','bari',[],[2]],[78,'Pt','platí',[],[2,4]],[79,'Au','or',[],[1,3]],[80,'Hg','mercuri',[],[1,2]],[81,'Tl','tal·li',[],[1,3]],[82,'Pb','plom',[],[2,4]],[83,'Bi','bismut',[],[3,5]],
];
const ELS = DATA.map(e => ({ z: e[0], sym: e[1], name: e[2], l: e[3], r: e[4] }));
const BY_Z = Object.fromEntries(ELS.map(e => [e.z, e]));

// Posició (fila = període, columna = grup)
function pos(z) {
  if (z === 1) return [1, 1];
  if (z <= 4) return [2, z - 2];
  if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10];
  if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18];
  if (z <= 54) return [5, z - 36];
  if (z <= 56) return [6, z - 54];
  return [6, z - 68]; // Hf..Bi (72–83)
}
// Caselles buides de la taula (no es pregunten)
const BLANKS = [[4,3],[4,4],[4,5],
  [5,3],[5,4],[5,5],[5,6],[5,7],[5,8],[5,9],
  [6,3],[6,4],[6,5],[6,6],[6,7],[6,8],[6,9],[6,16],[6,17]];

const SCOPES = {
  all:   z => true,
  p3:    z => pos(z)[0] <= 3,
  p4:    z => pos(z)[0] <= 4,
  main:  z => { const c = pos(z)[1]; return c <= 2 || c >= 13; },
  trans: z => { const c = pos(z)[1]; return c >= 6 && c <= 12; },
};

const LEVELS = {
  basic:  { show: true,  sym: false, name: true, z: false, ch: false },
  medium: { show: false, sym: true,  name: true, z: false, ch: false },
  adv:    { show: false, sym: true,  name: true, z: true,  ch: false },
  expert: { show: false, sym: true,  name: true, z: true,  ch: true  },
};

const $ = id => document.getElementById(id);
const lv = () => LEVELS[$('level').value];
const SETTINGS_KEY = 'taulaperiodica.v1';
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
  for (const id of ['level', 'order', 'scope'])
    if (saved[id] && [...$(id).options].some(o => o.value === saved[id])) $(id).value = saved[id];
} catch (e) { /* sense emmagatzematge: no passa res */ }
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ level: $('level').value, order: $('order').value, scope: $('scope').value })); } catch (e) {}
}
const tableEl = $('table');
const cellEls = {};

// ---------- Construcció de la taula ----------
function buildTable() {
  tableEl.innerHTML = '';
  const put = (el, r, c) => { el.style.gridRow = r + 1; el.style.gridColumn = c + 1; tableEl.appendChild(el); };
  for (let c = 1; c <= 17; c++) { const h = document.createElement('div'); h.className = 'hdr'; h.textContent = c; put(h, 0, c); }
  for (let r = 1; r <= 6; r++) { const h = document.createElement('div'); h.className = 'hdr'; h.textContent = r; put(h, r, 0); }
  for (const [r, c] of BLANKS) { const d = document.createElement('div'); d.className = 'cell blank'; put(d, r, c); }
  for (const e of ELS) {
    const d = document.createElement('div'); d.className = 'cell';
    const [r, c] = pos(e.z); put(d, r, c); cellEls[e.z] = d;
  }
}

// ---------- Estat del joc ----------
let queue = [], total = 0, doneCount = 0, firstTry = 0;
let cur = null, attempts = 0, solved = false, requeued = new Set();
// Primera ronda = cada casella resolta (o revelada) una vegada. Els salts i les solucions no compten com a encert.
let n0 = 0, t0 = 0, resolved = new Set(), skippedSet = new Set();
let round = null, roundDone = false, roundShown = false, savedEntry = null;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function fmtCh(n) { return n > 0 ? '+' + n : '−' + Math.abs(n); }
function chHtml(e) {
  const col = arr => '<span class="col">' + arr.map(v => '<i class="' + (v < 0 ? 'n' : 'p') + '">' + fmtCh(v) + '</i>').join('') + '</span>';
  return '<span class="cs">' + col(e.l) + col(e.r) + '</span>';
}
function setCell(z, state) {
  const d = cellEls[z], e = BY_Z[z];
  d.className = 'cell' + (state ? ' ' + state : '');
  d.removeAttribute('title');
  if (state === 'ok' || state === 'mid' || state === 'ko') {
    d.innerHTML = chHtml(e) + '<span class="s">' + e.sym + '</span>';
    d.title = e.name + ' · ' + e.z;
  } else d.innerHTML = '';
}

function start() {
  const inScope = SCOPES[$('scope').value];
  for (const e of ELS) setCell(e.z, inScope(e.z) ? '' : 'off');
  const list = ELS.filter(e => inScope(e.z));
  const order = $('order').value;
  if (order === 'rows') list.sort((a, b) => { const pa = pos(a.z), pb = pos(b.z); return pa[0] - pb[0] || pa[1] - pb[1]; });
  else if (order === 'cols') list.sort((a, b) => { const pa = pos(a.z), pb = pos(b.z); return pa[1] - pb[1] || pa[0] - pb[0]; });
  else shuffle(list);
  queue = list.map(e => e.z);
  total = queue.length; doneCount = 0; firstTry = 0; requeued = new Set(); cur = null;
  n0 = total; t0 = Date.now(); resolved = new Set(); skippedSet = new Set();
  round = null; roundDone = false; roundShown = false; savedEntry = null;
  $('done').classList.remove('show'); $('quiz').style.display = '';
  updateStats(); next();
}

function updateStats() {
  $('stDone').textContent = doneCount; $('stTotal').textContent = total; $('stFirst').textContent = firstTry;
  $('bar').style.width = total ? (100 * doneCount / total) + '%' : '0';
}

function next() {
  if (cur) { const d = cellEls[cur.z]; if (d.classList.contains('cur')) setCell(cur.z, ''); }
  if (roundDone && !roundShown) return showResults();
  if (!queue.length) return showResults();
  cur = BY_Z[queue.shift()]; attempts = 0; solved = false;
  const [r, c] = pos(cur.z);
  const L = lv();
  cellEls[cur.z].className = 'cell cur' + (L.show ? ' sym' : '');
  cellEls[cur.z].innerHTML = L.show ? '<span class="s">' + cur.sym + '</span>' : '';
  const where = 'Grup ' + c + ' · Període ' + r;
  $('where').innerHTML = (L.show ? 'Quin és el nom d\'aquest element?' : 'Quina casella és la que brilla?') + '<small>' + where + '</small>';
  $('fSym').hidden = !L.sym; $('fCh').hidden = !L.ch; $('fName').hidden = !L.name; $('fZ').hidden = !L.z;
  $('form').reset();
  for (const id of ['fSym', 'fCh', 'fName', 'fZ']) { const f = $(id); f.className = 'field'; f.querySelector('.note').textContent = ''; }
  resetSel();
  zoneEl.l.classList.remove('good', 'bad'); zoneEl.r.classList.remove('good', 'bad');
  showMsg('');
  $('btnMain').textContent = 'Comprova'; $('btnSolve').disabled = false; $('btnSkip').disabled = false;
  (L.sym ? $('inSym') : $('inName')).focus({ preventScroll: true });
}

function checkRound() {
  if (roundDone || resolved.size < n0) return;
  roundDone = true;
  round = { level: $('level').value, scope: $('scope').value, order: $('order').value, n: n0, correct: firstTry, ms: Date.now() - t0 };
}

// ---------- Entrada ----------
const chipEls = [];
const sel = { l: [], r: [] };
let side = 'l';
const zoneEl = { l: $('zL'), r: $('zR') };
function renderZones() {
  for (const k of ['l', 'r']) {
    zoneEl[k].setAttribute('aria-pressed', k === side ? 'true' : 'false');
    zoneEl[k].querySelector('.vals').innerHTML = sel[k].map(v => '<span class="v ' + (v < 0 ? 'n' : 'p') + '">' + fmtCh(v) + '</span>').join('<br>');
  }
  chipEls.forEach(b => b.setAttribute('aria-pressed', sel[side].includes(+b.dataset.v) ? 'true' : 'false'));
}
function resetSel() { sel.l = []; sel.r = []; side = 'l'; renderZones(); }
(function buildChips() {
  for (const v of [-4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 7]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip ' + (v < 0 ? 'n' : 'p'); b.dataset.v = v;
    b.textContent = fmtCh(v); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      if (solved) return;
      const i = sel[side].indexOf(v);
      if (i >= 0) sel[side].splice(i, 1); else sel[side].push(v);
      renderZones();
    });
    (v < 0 ? $('chNeg') : $('chPos')).appendChild(b); chipEls.push(b);
  }
})();
for (const k of ['l', 'r']) zoneEl[k].addEventListener('click', () => { side = k; renderZones(); });
$('btnClear').addEventListener('click', () => { if (!solved) { sel[side] = []; renderZones(); } });

$('inSym').addEventListener('input', e => {
  const v = e.target.value.replace(/[^A-Za-z]/g, '');
  e.target.value = v ? v[0].toUpperCase() + v.slice(1).toLowerCase() : '';
});

const norm = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[·.\-'’\s]/g, '');
function mark(id, ok, note) {
  const f = $(id); f.classList.remove('ok', 'ko'); f.classList.add(ok ? 'ok' : 'ko');
  f.querySelector('.note').textContent = note || '';
}
function showMsg(t, kind) { const m = $('msg'); m.className = 'msg' + (t ? ' show ' + kind : ''); m.textContent = t; }

function grade() {
  const res = {};
  const sym = $('inSym').value.trim();
  res.sym = sym === cur.sym;
  const nm = $('inName').value.trim();
  res.name = !!nm && norm(nm) === norm(cur.name);
  res.nameExact = res.name && nm.toLowerCase() === cur.name;
  const z = parseInt($('inZ').value, 10);
  res.z = z === cur.z;
  const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  res.l = same(sel.l, cur.l); res.r = same(sel.r, cur.r); res.ch = res.l && res.r;
  return res;
}

function solutionText() {
  const f = a => a.length ? a.map(fmtCh).join(' ') : '—';
  return cur.sym + ' · ' + cur.name + ' · ' + cur.z + ' protons · esquerra: ' + f(cur.l) + ' · dreta: ' + f(cur.r);
}

function check() {
  attempts++;
  const r = grade(), L = lv();
  if (L.sym) mark('fSym', r.sym, r.sym ? '' : 'Torna-ho a provar');
  if (L.name) mark('fName', r.name, r.name ? (r.nameExact ? '' : 'Ortografia: ' + cur.name) : 'Torna-ho a provar');
  if (L.z) mark('fZ', r.z, r.z ? '' : 'Torna-ho a provar');
  if (L.ch) {
    mark('fCh', r.ch, r.ch ? '' : 'Torna-ho a provar (esquerra ' + (r.l ? '✓' : '✗') + ', dreta ' + (r.r ? '✓' : '✗') + ' · compte amb l\'ordre)');
    zoneEl.l.classList.toggle('good', r.l); zoneEl.l.classList.toggle('bad', !r.l);
    zoneEl.r.classList.toggle('good', r.r); zoneEl.r.classList.toggle('bad', !r.r);
  }
  if ((!L.sym || r.sym) && (!L.name || r.name) && (!L.z || r.z) && (!L.ch || r.ch)) {
    solved = true;
    const first = attempts === 1;
    if (first && !resolved.has(cur.z) && !skippedSet.has(cur.z)) firstTry++;
    resolved.add(cur.z); checkRound();
    setCell(cur.z, first ? 'ok' : 'mid'); doneCount++; updateStats();
    showMsg((first ? 'Correcte! ' : 'Ja ho tens! ') + solutionText(), 'good');
    toNextMode();
  } else {
    showMsg('Alguna cosa no quadra. Corregeix els camps en vermell o mira la solució.', 'bad');
  }
}

function skip() {
  skippedSet.add(cur.z);
  queue.push(cur.z);
  next();
}

function reveal() {
  const L = lv();
  $('inSym').value = cur.sym; $('inName').value = cur.name; $('inZ').value = cur.z;
  if (L.sym) mark('fSym', true);
  if (L.name) mark('fName', true);
  if (L.z) mark('fZ', true);
  if (L.ch) {
    sel.l = cur.l.slice(); sel.r = cur.r.slice(); renderZones(); mark('fCh', true);
    zoneEl.l.classList.add('good'); zoneEl.r.classList.add('good');
  }
  setCell(cur.z, 'ko'); doneCount++;
  resolved.add(cur.z); checkRound();
  if (!requeued.has(cur.z)) { requeued.add(cur.z); queue.push(cur.z); total++; }
  updateStats();
  solved = true;
  showMsg('Solució: ' + solutionText() + ' (tornarà a sortir al final)', 'info');
  toNextMode();
}

function toNextMode() {
  $('btnMain').textContent = (roundDone && !roundShown) ? 'Veure resultats' : (queue.length ? 'Següent' : 'Acaba');
  $('btnSolve').disabled = true; $('btnSkip').disabled = true;
  $('btnMain').focus({ preventScroll: true });
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (solved) next(); else check();
});
$('btnSolve').addEventListener('click', () => { if (!solved) reveal(); });
$('btnSkip').addEventListener('click', () => { if (!solved) skip(); });
$('btnAgain').addEventListener('click', start);
$('restart').addEventListener('click', start);
for (const id of ['level', 'order', 'scope']) $(id).addEventListener('change', () => { saveSettings(); start(); });


// ---------- Rànquing (guardat al navegador d'aquest dispositiu) ----------
const RANK_KEY = 'taulaperiodica.ranking.v1', PLAYER_KEY = 'taulaperiodica.player';
const LEVEL_NAME = { basic: 'Bàsic', medium: 'Mitjà', adv: 'Avançat', expert: 'Expert' };
let rankMem = [];
try { const a = JSON.parse(localStorage.getItem(RANK_KEY) || '[]'); if (Array.isArray(a)) rankMem = a; } catch (e) {}
function persistRank() { try { localStorage.setItem(RANK_KEY, JSON.stringify(rankMem)); return true; } catch (e) { return false; } }
const cmpRun = (a, b) => (b.correct / b.n) - (a.correct / a.n) || (a.ms / a.n) - (b.ms / b.n) || a.t - b.t;
const entriesFor = (level, scope) => rankMem.filter(e => e.level === level && e.scope === scope).sort(cmpRun);
const fmtTime = ms => { const t = Math.round(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const pct = (c, n) => Math.round(100 * c / n);
const scopeName = v => { const o = [...$('scope').options].find(o => o.value === v); return o ? o.textContent : v; };

function renderRank(box, level, scope, hiId) {
  box.replaceChildren();
  const list = entriesFor(level, scope);
  if (!list.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Encara no hi ha cap resultat en aquest nivell.'; box.appendChild(d); return; }
  const tbl = document.createElement('table'); tbl.className = 'rank';
  const head = document.createElement('tr');
  for (const [t, cls] of [['#', ''], ['Nom', ''], ['Encerts', 'r'], ['Temps', 'r']]) { const th = document.createElement('th'); th.textContent = t; if (cls) th.className = cls; head.appendChild(th); }
  tbl.appendChild(head);
  const rows = list.map((e, i) => ({ e, pos: i + 1 }));
  let shown = rows.slice(0, 10);
  const me = rows.find(r => r.e.id === hiId);
  if (me && !shown.includes(me)) shown = shown.concat(me);
  for (const { e, pos } of shown) {
    const tr = document.createElement('tr'); if (e.id === hiId) tr.className = 'me';
    const cells = [[pos, ''], [e.name, 'nm'], [e.correct + '/' + e.n + ' · ' + pct(e.correct, e.n) + '%', 'r'], [fmtTime(e.ms), 'r']];
    for (const [t, cls] of cells) { const td = document.createElement('td'); td.textContent = t; if (cls) td.className = cls; tr.appendChild(td); }
    tbl.appendChild(tr);
  }
  box.appendChild(tbl);
}

function showResults() {
  const first = !roundShown; roundShown = true;
  if (!round) checkRound();
  const R = round;
  $('quiz').style.display = 'none'; $('done').classList.add('show');
  $('doneTitle').textContent = first ? 'Primera ronda acabada! 🎉' : 'Repàs acabat 👏';
  $('doneBig').textContent = R.correct + '/' + R.n + ' · ' + pct(R.correct, R.n) + '%';
  $('doneTxt').textContent = 'Nivell ' + LEVEL_NAME[R.level] + ' · ' + scopeName(R.scope) + ' · ' + fmtTime(R.ms) + ' · al primer intent';
  $('inPlayer').value = (() => { try { return localStorage.getItem(PLAYER_KEY) || ''; } catch (e) { return ''; } })();
  $('btnSave').disabled = !!savedEntry; $('btnSave').textContent = savedEntry ? 'Desat ✓' : 'Desa al rànquing';
  $('saveForm').style.display = '';
  updateDoneRank();
  $('btnReview').style.display = queue.length ? '' : 'none';
  $('btnReview').textContent = 'Repassa els errors (' + queue.length + ')';
  updateStats();
}
function updateDoneRank() {
  const R = round;
  let preview = '';
  if (!savedEntry) {
    const better = entriesFor(R.level, R.scope).filter(e => cmpRun(e, R) < 0).length;
    preview = 'Si el deses, quedaràs en la posició ' + (better + 1) + '.';
  } else {
    preview = 'Posició ' + (entriesFor(R.level, R.scope).findIndex(e => e.id === savedEntry.id) + 1) + ' al rànquing.';
  }
  $('savedTxt').textContent = preview;
  $('doneRankHead').textContent = 'Rànquing · ' + LEVEL_NAME[R.level] + ' · ' + scopeName(R.scope);
  renderRank($('doneRank'), R.level, R.scope, savedEntry && savedEntry.id);
}
$('saveForm').addEventListener('submit', e => {
  e.preventDefault();
  if (savedEntry || !round) return;
  const name = $('inPlayer').value.trim() || 'Jugador';
  savedEntry = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), t: Date.now(), name, level: round.level, scope: round.scope, order: round.order, n: round.n, correct: round.correct, ms: round.ms };
  rankMem.push(savedEntry);
  // màxim 100 resultats per nivell i abast
  const keep = new Set(entriesFor(round.level, round.scope).slice(0, 100).map(x => x.id));
  rankMem = rankMem.filter(x => x.level !== round.level || x.scope !== round.scope || keep.has(x.id));
  const ok = persistRank();
  try { localStorage.setItem(PLAYER_KEY, name); } catch (e) {}
  $('btnSave').disabled = true; $('btnSave').textContent = 'Desat ✓';
  updateDoneRank();
  if (!ok) $('savedTxt').textContent += ' (No s\'ha pogut desar al navegador: es perdrà en tancar.)';
});
$('btnReview').addEventListener('click', () => { $('done').classList.remove('show'); $('quiz').style.display = ''; next(); });

// Diàleg del rànquing (tots els nivells)
const dlg = $('rankDlg');
for (const o of $('level').options) $('rkLevel').add(new Option(LEVEL_NAME[o.value], o.value));
for (const o of $('scope').options) $('rkScope').add(new Option(o.textContent, o.value));
const drawDlg = () => renderRank($('rankBox'), $('rkLevel').value, $('rkScope').value, null);
$('btnRank').addEventListener('click', () => {
  $('rkLevel').value = $('level').value; $('rkScope').value = $('scope').value; drawDlg();
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
});
$('rkLevel').addEventListener('change', drawDlg); $('rkScope').addEventListener('change', drawDlg);
$('btnRankClose').addEventListener('click', () => dlg.close());
$('btnRankClear').addEventListener('click', () => {
  const lv_ = $('rkLevel').value, sc = $('rkScope').value;
  if (!entriesFor(lv_, sc).length) return;
  if (!confirm('Vols esborrar el rànquing ' + LEVEL_NAME[lv_] + ' · ' + $('rkScope').selectedOptions[0].textContent + '?')) return;
  rankMem = rankMem.filter(x => x.level !== lv_ || x.scope !== sc); persistRank(); drawDlg();
  if (round && round.level === lv_ && round.scope === sc) { savedEntry = null; if ($('done').classList.contains('show')) showResults(); }
});

buildTable();
start();
</script>
</body>
</html>
